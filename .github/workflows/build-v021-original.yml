name: NOSTALOOM Pixel v0.21 HUD Calculator Fingerprint Restore
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-v021-original.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  original:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore the original source, actual wallpaper, and Tamagotchi controls
        shell: bash
        run: |
          set -euo pipefail
          unzip -q releases/v0.12/NOSTALOOM-Pixel-Pet-OS-v0.12-source.zip -d restored
          test -s restored/NOSTALOOM-Retro-Launcher/app/src/main/res/drawable-nodpi/cozy_home.png
          ls -lh restored/NOSTALOOM-Retro-Launcher/app/src/main/res/drawable-nodpi/cozy_home.png
          test -s restored/NOSTALOOM-Retro-Launcher/app/src/main/java/com/mygamestudio/nostaloomlauncher/MochiCare.java
          test -s restored/NOSTALOOM-Retro-Launcher/app/src/main/java/com/mygamestudio/nostaloomlauncher/MochiSpriteView.java
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('restored/NOSTALOOM-Retro-Launcher')
          p=root/'app/build.gradle'
          s=p.read_text()
          assert "applicationId 'com.mygamestudio.nostaloomlauncher.pixelpet'" in s
          s=s.replace("applicationId 'com.mygamestudio.nostaloomlauncher.pixelpet'", "applicationId 'com.mygamestudio.nostaloomlauncher.restoredv021'")
          s=re.sub(r'versionCode\s+12\b', 'versionCode 21', s)
          s=s.replace("versionName '0.12'", "versionName '0.21-original-hud-test'")
          p.write_text(s)
          manifest=root/'app/src/main/AndroidManifest.xml'
          m=manifest.read_text()
          # Notification access has been linked to prior device warnings;
          # preserve gameplay but do not register any notification listener in this test build.
          m,n=re.subn(r'\s*<service\b[^>]*NotificationFruitService.*?</service>', '', m, flags=re.S)
          assert n==1, 'Expected one legacy notification listener service'
          m=m.replace('NOSTALOOM Pixel Pet OS 0.12', 'NOSTALOOM Pixel v0.21 Original')
          manifest.write_text(m)

          # Preserve the original illustrated scene; add precise clickable zones to the two empty grid slots.
          java=root/'app/src/main/java/com/mygamestudio/nostaloomlauncher/PixelLauncherActivity.java'
          src=java.read_text()
          marker='        socialShortcut(SocialApp.WHATSAPP, 531);'
          assert src.count(marker)==1
          src=src.replace(marker,'''        tapZone("Calculator", 264, 874, 100, 115, this::calculator);
        tapZone("Fingerprint", 374, 874, 100, 115, this::fingerprintGate);
''' + marker)
          marker='    private void camera() {'
          assert src.count(marker)==1
          method='''    private void calculator() {
        if (launchInstalled("com.miui.calculator")) return;
        if (launchInstalled("com.google.android.calculator")) return;
        Intent intent = new Intent(Intent.ACTION_MAIN);
        intent.addCategory(Intent.CATEGORY_APP_CALCULATOR);
        openIntent(intent);
    }
    private void fingerprintGate() {
        if (android.os.Build.VERSION.SDK_INT < 28) {
            openIntent(new Intent(Settings.ACTION_SECURITY_SETTINGS));
            return;
        }
        try {
            android.hardware.biometrics.BiometricPrompt prompt =
                new android.hardware.biometrics.BiometricPrompt.Builder(this)
                    .setTitle("NOSTALOOM PRIVATE APPS")
                    .setSubtitle("Sahkan cap jari untuk melihat aplikasi")
                    .setNegativeButton("Batal", getMainExecutor(), (dialog, which) -> {})
                    .build();
            prompt.authenticate(new android.os.CancellationSignal(), getMainExecutor(),
                new android.hardware.biometrics.BiometricPrompt.AuthenticationCallback() {
                    @Override public void onAuthenticationSucceeded(
                        android.hardware.biometrics.BiometricPrompt.AuthenticationResult result) {
                        super.onAuthenticationSucceeded(result);
                        appDrawer();
                    }
                    @Override public void onAuthenticationError(int errorCode, CharSequence err) {
                        super.onAuthenticationError(errorCode, err);
                        if (errorCode != android.hardware.biometrics.BiometricPrompt.BIOMETRIC_ERROR_USER_CANCELED) {
                            Toast.makeText(PixelLauncherActivity.this, err, Toast.LENGTH_SHORT).show();
                        }
                    }
                });
        } catch (Exception problem) {
            Toast.makeText(this, "Tetapkan cap jari dalam Android Security", Toast.LENGTH_SHORT).show();
            openIntent(new Intent(Settings.ACTION_SECURITY_SETTINGS));
        }
    }
'''
          src=src.replace(marker,method+marker)
          java.write_text(src)
          # Rebuild the Mochi HUD in the original region without touching the illustrated background asset.
          hud=root/'app/src/main/java/com/mygamestudio/nostaloomlauncher/PixelHomeView.java'
          view=hud.read_text()
          head=view.index('    static final class PetPanel extends ArtworkView {')
          tail=view.index('    static final class PetButton extends ArtworkView {',head)
          portion=view[head:tail]
          a=portion.index('        @Override void drawArtwork(Canvas canvas) {')
          b=portion.index('        private void meter(Canvas canvas,',a)
          replacement='''        @Override void drawArtwork(Canvas canvas) {
            paint.setColor(0xfff7eee1);
            canvas.drawRoundRect(0, 0, 230, 130, 9, 9, paint);
            paint.setColor(0xffceb7e5);
            canvas.drawRoundRect(1, 1, 229, 24, 7, 7, paint);
            text(canvas, "HELLO, JAMAL!", 115, 19, 17, INK, Paint.Align.CENTER);
            meter(canvas, "HAPPINESS", pet.happiness, 42, 0xffe777ad);
            meter(canvas, "HUNGER", pet.fullness, 70, 0xffdfae61);
            meter(canvas, "ENERGY", pet.energy, 98, 0xffa786dd);
            text(canvas, state, 12, 128, 10, INK, Paint.Align.LEFT);
        }

'''
          portion=portion[:a]+replacement+portion[b:]
          view=view[:head]+portion+view[tail:]
          hud.write_text(view)
          # Android system fingerprint authentication is used to gate access to the app drawer.
          # It does NOT unlock the Android system lock screen.
          manifest=root/'app/src/main/AndroidManifest.xml'
          m=manifest.read_text()
          m=m.replace('    <queries>', '    <uses-permission android:name="android.permission.USE_BIOMETRIC" />\\n    <queries>',1)
          manifest.write_text(m)
          print('v0.21 patch installed: Calculator, biometric-gated app drawer, improved Mochi HUD')
          print('Restored complete v0.12 source with original cozy_home.png and gameplay')
          print('Removed notification listener registration for this test build')
          PY
      - name: Install Android SDK 34
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="$RUNNER_TEMP/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fLsS --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o "$RUNNER_TEMP/tools.zip"
          unzip -q "$RUNNER_TEMP/tools.zip" -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build full restored app from original sources
        working-directory: restored/NOSTALOOM-Retro-Launcher
        run: gradle --no-daemon assembleDebug
      - name: Verify package, signature and original art
        shell: bash
        run: |
          set -euo pipefail
          APK=restored/NOSTALOOM-Retro-Launcher/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/zipalign" -c -v 4 "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | head -4 | tee app-info.txt
          grep -F "com.mygamestudio.nostaloomlauncher.restoredv021" app-info.txt
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump permissions "$APK" | tee app-permissions.txt
          if grep -E 'android.permission.(BIND_NOTIFICATION_LISTENER_SERVICE|BIND_ACCESSIBILITY_SERVICE|READ_SMS|READ_CALL_LOG|QUERY_ALL_PACKAGES)' app-permissions.txt; then
            echo "::error::Restricted permission unexpectedly found"
            exit 1
          fi
          unzip -Z -1 "$APK" | grep -F 'res/drawable-nodpi' || echo "Resource packaging uses compiled asset identifiers"
          sha256sum "$APK" | tee SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: NOSTALOOM-Pixel-v0.21-Original-Graphics-Test
          path: |
            restored/NOSTALOOM-Retro-Launcher/app/build/outputs/apk/debug/app-debug.apk
            app-info.txt
            app-permissions.txt
            SHA256.txt
          if-no-files-found: error
      - name: Publish v0.21 test APK on GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir dist
          cp restored/NOSTALOOM-Retro-Launcher/app/build/outputs/apk/debug/app-debug.apk dist/NOSTALOOM-Pixel-v0.21-Original-Graphics-Test.apk
          cp SHA256.txt app-permissions.txt dist/
          cat > dist/README.txt <<'EOF'
          NOSTALOOM Pixel v0.21 Original Graphics Test.
          Restored from the real archived v0.12 source, including cozy_home.png,
          original floating-island wallpaper and Mochi cat game components.
          Rebuilt as a separate package for safe side-by-side installation.
          Notification listener is disabled in this build.
          Debug-signed test APK; not Play Protect certified.
          Fingerprint authenticates for private app drawer access, not system screen unlock.
          Do not bypass Google Play Protect warnings.
          EOF
          gh release create v0.21-original-graphics-test \
            dist/NOSTALOOM-Pixel-v0.21-Original-Graphics-Test.apk \
            dist/SHA256.txt dist/app-permissions.txt dist/README.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "NOSTALOOM Pixel v0.21 - Original HUD and Calculator Fingerprint (Test)" \
            --notes "Preserves original floating-island wallpaper, updates Mochi HUD, adds Calculator and fingerprint-gated app drawer. Separate debug app ID, notification listener disabled for safer testing. Test build only, not Play Protect certified." \
            --prerelease
