name: Inspect legacy v0.12 assets for v0.20
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/inspect-legacy-v020.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: List legacy project source and graphics
        shell: bash
        run: |
          set -euo pipefail
          ls -lh releases/v0.12
          echo '=== LEGACY SOURCE ZIP FILES ==='
          unzip -Z -1 releases/v0.12/NOSTALOOM-Pixel-Pet-OS-v0.12-source.zip | head -150
          echo '=== LEGACY SOURCE ZIP ASSET TYPES ==='
          unzip -Z -1 releases/v0.12/NOSTALOOM-Pixel-Pet-OS-v0.12-source.zip | grep -Ei '\.(png|jpg|webp|svg|kt|java|html|css|js|json)$' | head -100 || true
          echo '=== LEGACY APP BUILD GRADLE ==='
          unzip -p releases/v0.12/NOSTALOOM-Pixel-Pet-OS-v0.12-source.zip '*/app/build.gradle'
          echo '=== LEGACY PROJECT BUILD GRADLE ==='
          unzip -p releases/v0.12/NOSTALOOM-Pixel-Pet-OS-v0.12-source.zip '*/build.gradle'
          echo '=== LEGACY MANIFEST ==='
          unzip -p releases/v0.12/NOSTALOOM-Pixel-Pet-OS-v0.12-source.zip '*/app/src/main/AndroidManifest.xml'
          echo '=== SOURCE README CONTENT ==='
          unzip -p releases/v0.12/NOSTALOOM-Pixel-Pet-OS-v0.12-source.zip '*README*' | head -80 || true

          echo '=== PIXEL HOME STRUCTURE AND SHORTCUT HANDLERS ==='
          unzip -p releases/v0.12/NOSTALOOM-Pixel-Pet-OS-v0.12-source.zip '*/PixelHomeView.java' > /tmp/PixelHomeView.java
          grep -nEi 'calc|finger|lock|hud|pet|mochi|happy|hunger|energy|shortcut|icon|appdrawer|grid' /tmp/PixelHomeView.java | head -145 || true
          echo '=== PIXEL HOME HEAD ==='
          sed -n '1,160p' /tmp/PixelHomeView.java
          echo '=== PIXEL LAUNCHER STRUCTURE ==='
          unzip -p releases/v0.12/NOSTALOOM-Pixel-Pet-OS-v0.12-source.zip '*/PixelLauncherActivity.java' > /tmp/PixelLauncherActivity.java
          grep -nEi 'calc|finger|lock|hud|pet|mochi|happy|hunger|energy|shortcut|icon|appdrawer|grid|onCreate' /tmp/PixelLauncherActivity.java | head -150 || true
          echo '=== PIXEL HOME END ==='
          tail -100 /tmp/PixelHomeView.java

          echo '=== LAUNCHER LINES 118-215 ==='
          sed -n '118,215p' /tmp/PixelLauncherActivity.java
          echo '=== LAUNCHER LINES 347-460 ==='
          sed -n '347,460p' /tmp/PixelLauncherActivity.java
          echo '=== HUD LINES 290-340 ==='
          sed -n '290,340p' /tmp/PixelHomeView.java
