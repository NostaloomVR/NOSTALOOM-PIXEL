name: NOSTALOOM Pixel v0.16 Clean Install Test

on:
  push:
    branches: [main]
    paths:
      - "native-app/**"
      - ".github/workflows/android-native-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Validate permission-minimal manifest
        shell: bash
        run: |
          set -euo pipefail
          test -f native-app/app/src/main/AndroidManifest.xml
          test -f native-app/app/src/main/java/com/nostaloom/pixel/MainActivity.java
          if grep -E 'uses-permission|BIND_ACCESSIBILITY_SERVICE|REQUEST_INSTALL_PACKAGES|QUERY_ALL_PACKAGES|READ_SMS|READ_CALL_LOG' native-app/app/src/main/AndroidManifest.xml; then
            echo "::error::Unexpected sensitive permission or privileged capability in launcher preview"
            exit 1
          fi
      - name: Install Android command-line tools
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="$RUNNER_TEMP/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fLsS --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o "$RUNNER_TEMP/android-tools.zip"
          unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platforms;android-34" "build-tools;34.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build fresh native preview APK
        working-directory: native-app
        run: gradle --no-daemon :app:assembleDebug
      - name: Inspect APK signature and permissions
        shell: bash
        run: |
          set -euo pipefail
          APK=native-app/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | head -3 | tee apk-package.txt
          grep -F "com.nostaloom.pixel.cleaninstall" apk-package.txt
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump permissions "$APK" | tee apk-permissions.txt
          if grep -Ei 'android.permission.(BIND_ACCESSIBILITY_SERVICE|READ_SMS|READ_CALL_LOG|REQUEST_INSTALL_PACKAGES)' apk-permissions.txt; then
            echo "::error::Sensitive permission detected"
            exit 1
          fi
          sha256sum "$APK" | tee apk-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: NOSTALOOM-Pixel-v0.16-CLEAN-INSTALL-UNVERIFIED
          path: |
            native-app/app/build/outputs/apk/debug/app-debug.apk
            apk-sha256.txt
            apk-package.txt
            apk-permissions.txt
          if-no-files-found: error

      - name: Publish public GitHub prerelease APK download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp native-app/app/build/outputs/apk/debug/app-debug.apk dist/NOSTALOOM-Pixel-v0.16-Clean-Install-TEST.apk
          cp apk-sha256.txt dist/SHA256.txt
          cat > dist/INSTALL-NOTES.txt <<'EOF'
          NOSTALOOM Pixel v0.16 - Clean Install Test
          Android 8.0 or later; test version signed with GitHub Actions debug key.
          This is not a certified Google Play release and is NOT Play Protect verified.
          Package: com.nostaloom.pixel.cleaninstall
          If Play Protect blocks installation, do not bypass the warning.
          Do not use this test APK as an update to previously installed package variants.
          EOF
          gh release create v0.16-clean-install-test             dist/NOSTALOOM-Pixel-v0.16-Clean-Install-TEST.apk             dist/SHA256.txt             dist/INSTALL-NOTES.txt             --repo "$GITHUB_REPOSITORY"             --target "$GITHUB_SHA"             --title "NOSTALOOM Pixel v0.16 - Clean Install Test (debug)"             --notes "Test APK only. Rebuilt from native-app and inspected for signature and Android permissions. Not Google Play Protect certified; do not bypass a security warning. Package com.nostaloom.pixel.cleaninstall."             --prerelease
