name: NOSTALOOM Pixel v0.24 Browser-Matched Calculator & Lockscreen Icons
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-v024-matched-icons.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  original:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Pillow for pixel-perfect native artwork patch
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/pixel-venv"
          "$RUNNER_TEMP/pixel-venv/bin/pip" install --disable-pip-version-check pillow
      - name: Restore the original source, actual wallpaper, and Tamagotchi controls
        shell: bash
        run: |
          set -euo pipefail
          unzip -q releases/v0.12/NOSTALOOM-Pixel-Pet-OS-v0.12-source.zip -d restored
          test -s restored/NOSTALOOM-Retro-Launcher/app/src/main/res/drawable-nodpi/cozy_home.png
          ls -lh restored/NOSTALOOM-Retro-Launcher/app/src/main/res/drawable-nodpi/cozy_home.png
          test -s restored/NOSTALOOM-Retro-Launcher/app/src/main/java/com/mygamestudio/nostaloomlauncher/MochiCare.java
          test -s restored/NOSTALOOM-Retro-Launcher/app/src/main/java/com/mygamestudio/nostaloomlauncher/MochiSpriteView.java
          "$RUNNER_TEMP/pixel-venv/bin/python" - <<'PY'
          from pathlib import Path
          import re
          root=Path('restored/NOSTALOOM-Retro-Launcher')
          p=root/'app/build.gradle'
          s=p.read_text()
          assert "applicationId 'com.mygamestudio.nostaloomlauncher.pixelpet'" in s
          s=s.replace("applicationId 'com.mygamestudio.nostaloomlauncher.pixelpet'", "applicationId 'com.mygamestudio.nostaloomlauncher.restoredv024'")
          s=re.sub(r'versionCode\s+12\b', 'versionCode 24', s)
          s=s.replace("versionName '0.12'", "versionName '0.24-matched-icon-tiles-test'")
          p.write_text(s)
          manifest=root/'app/src/main/AndroidManifest.xml'
          m=manifest.read_text()
          # Notification access has been linked to prior device warnings;
          # preserve gameplay but do not register any notification listener in this test build.
          m,n=re.subn(r'\s*<service\b[^>]*NotificationFruitService.*?</service>', '', m, flags=re.S)
          assert n==1, 'Expected one legacy notification listener service'
          m=m.replace('NOSTALOOM Pixel Pet OS 0.12', 'NOSTALOOM Pixel v0.24 Original')
          manifest.write_text(m)

          # Reuse the original wallpaper and Mochi engine. Render actual icon artwork,
          # not invisible tap areas, and provide opt-in Android system screen lock.
          java=root/'app/src/main/java/com/mygamestudio/nostaloomlauncher/PixelLauncherActivity.java'
          src=java.read_text()
          marker='        socialShortcut(SocialApp.WHATSAPP, 531);'
          assert src.count(marker)==1
          new_icons='''        tapZone("Calculator", 236, 858, 103, 120, this::calculator);
        View fingerprintZone=tapZone("Lockscreen", 343, 858, 103, 120, this::lockScreen);
        fingerprintZone.setOnLongClickListener(view -> {
            openIntent(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS));
            return true;
        });
'''
          src=src.replace(marker,new_icons+marker)
          marker='    private void camera() {'
          assert src.count(marker)==1
          methods='''    private void calculator() {
          if (launchInstalled("com.miui.calculator")) return;
          if (launchInstalled("com.google.android.calculator")) return;
          Intent intent = new Intent(Intent.ACTION_MAIN);
          intent.addCategory(Intent.CATEGORY_APP_CALCULATOR);
          openIntent(intent);
          }
          private void lockScreen() {
          android.app.admin.DevicePolicyManager manager =
            (android.app.admin.DevicePolicyManager)getSystemService(DEVICE_POLICY_SERVICE);
          android.content.ComponentName admin = new android.content.ComponentName(
            this, PixelScreenAdmin.class);
          if (manager == null) {
            Toast.makeText(this, "Device policy tidak tersedia", Toast.LENGTH_LONG).show();
            return;
          }
          if (manager.isAdminActive(admin)) {
            try {
                manager.lockNow();
            } catch (SecurityException ex) {
                Toast.makeText(this, "Kunci skrin ditolak Android", Toast.LENGTH_LONG).show();
            }
            return;
          }
          // The user must explicitly approve Android Device Admin before first lock.
          new AlertDialog.Builder(this).setTitle("Aktifkan Screen OFF?")
            .setMessage("Benarkan NOSTALOOM mengunci skrin apabila ikon fingerprint ditekan? "
                + "Android mengurus buka kunci dengan cap jari yang sudah didaftarkan. "
                + "Kebenaran pentadbir peranti boleh ditarik balik melalui Security Settings.")
            .setNegativeButton("Batal", (d, which) -> {})
            .setPositiveButton("Aktifkan", (d, which) -> {
                Intent intent = new Intent(android.app.admin.DevicePolicyManager.ACTION_ADD_DEVICE_ADMIN);
                intent.putExtra(android.app.admin.DevicePolicyManager.EXTRA_DEVICE_ADMIN, admin);
                intent.putExtra(android.app.admin.DevicePolicyManager.EXTRA_ADD_EXPLANATION,
                    "Kebenaran pilihan untuk Screen OFF melalui ikon Lockscreen");
                startActivity(intent);
            }).show();
          }
          '''
          src=src.replace(marker,methods+marker)
          java.write_text(src)

          # Original wallpaper holds all eight icon sprites; only click zones are native.
          # Register a device-admin receiver only for user-approved lockNow().
          receiver=root/'app/src/main/java/com/mygamestudio/nostaloomlauncher/PixelScreenAdmin.java'
          receiver.write_text('''package com.mygamestudio.nostaloomlauncher;
          public final class PixelScreenAdmin extends android.app.admin.DeviceAdminReceiver {}
          ''')
          xml=root/'app/src/main/res/xml'
          xml.mkdir(parents=True,exist_ok=True)
          (xml/'nostaloom_device_admin.xml').write_text('''<?xml version="1.0" encoding="utf-8"?>
          <device-admin xmlns:android="http://schemas.android.com/apk/res/android">
          <uses-policies><force-lock /></uses-policies>
          </device-admin>
          ''')
          manifest=root/'app/src/main/AndroidManifest.xml'
          m=manifest.read_text()
          receiver_tag='''<receiver android:name="com.mygamestudio.nostaloomlauncher.PixelScreenAdmin"
          android:permission="android.permission.BIND_DEVICE_ADMIN" android:exported="true">
          <meta-data android:name="android.app.device_admin" android:resource="@xml/nostaloom_device_admin" />
          <intent-filter><action android:name="android.app.action.DEVICE_ADMIN_ENABLED" /></intent-filter>
          </receiver>
          '''
          assert '</application>' in m
          m=m.replace('</application>',receiver_tag+'</application>')
          manifest.write_text(m)
          # Prefer an opt-in Android 9+ accessibility lock action instead of
          # DevicePolicyManager.lockNow(), which may require PIN/password after lock.
          # The service does not read screen content or inspect interaction events.
          java=root/'app/src/main/java/com/mygamestudio/nostaloomlauncher/PixelLauncherActivity.java'
          src=java.read_text()
          a=src.index('private void lockScreen() {')
          a=src.rfind('\n',0,a)+1
          b=src.index('    private void camera() {',a)
          src=src[:a]+'''    private void lockScreen() {
                  if (android.os.Build.VERSION.SDK_INT >= 28 && PixelScreenLockService.lockNow()) return;
                  if (android.os.Build.VERSION.SDK_INT < 28) {
                      Toast.makeText(this, "Lock dengan fingerprint memerlukan Android 9+", Toast.LENGTH_LONG).show();
                      openIntent(new Intent(Settings.ACTION_SECURITY_SETTINGS));
                      return;
                  }
                  new AlertDialog.Builder(this)
                      .setTitle("Lockscreen + Fingerprint")
                      .setMessage("Bagi membolehkan cap jari selepas kunci skrin, hidupkan perkhidmatan "
                          + "NOSTALOOM Screen Lock di Accessibility Settings. "
                          + "Perkhidmatan ini hanya melakukan tindakan Lock Screen dan tidak membaca "
                          + "kandungan skrin. Android/MIUI tetap mengawal unlock dan mungkin meminta PIN. "
                          + "Jika pernah menggunakan Device Admin untuk lockNow(), anda boleh nyahaktifkannya "
                          + "melalui tetapan keselamatan Android.")
                      .setPositiveButton("Tetapan Accessibility", (d, which) -> {
                          openIntent(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS));
                      })
                      .setNegativeButton("Batal", (d, which) -> {})
                      .show();
              }
          ''' + src[b:]
          src=src.replace('openIntent(new Intent(Settings.ACTION_SECURITY_SETTINGS));\n            return true;\n        });',
              'openIntent(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS));\n            return true;\n        });')
          java.write_text(src)
          service=root/'app/src/main/java/com/mygamestudio/nostaloomlauncher/PixelScreenLockService.java'
          service.write_text('''package com.mygamestudio.nostaloomlauncher;
          
          public final class PixelScreenLockService extends android.accessibilityservice.AccessibilityService {
              private static volatile PixelScreenLockService active;
          
              @Override public void onServiceConnected() {
                  super.onServiceConnected();
                  active=this;
              }
              @Override public boolean onUnbind(android.content.Intent intent) {
                  if (active==this) active=null;
                  return super.onUnbind(intent);
              }
              @Override public void onDestroy() {
                  if (active==this) active=null;
                  super.onDestroy();
              }
              @Override public void onAccessibilityEvent(android.view.accessibility.AccessibilityEvent event) {}
              @Override public void onInterrupt() {}
          
              static boolean lockNow() {
                  PixelScreenLockService current=active;
                  return current!=null && android.os.Build.VERSION.SDK_INT>=28
                      && current.performGlobalAction(GLOBAL_ACTION_LOCK_SCREEN);
              }
          }
          ''')
          xml=root/'app/src/main/res/xml'
          (xml/'nostaloom_accessibility_lock.xml').write_text('''<?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeViewClicked"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:notificationTimeout="100"
              android:canRetrieveWindowContent="false"
              android:canPerformGestures="false" />
          ''')
          manifest=root/'app/src/main/AndroidManifest.xml'
          m=manifest.read_text()
          a11y='''<service android:name="com.mygamestudio.nostaloomlauncher.PixelScreenLockService"
              android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
              android:exported="true" android:label="NOSTALOOM Screen Lock">
              <intent-filter>
                  <action android:name="android.accessibilityservice.AccessibilityService" />
              </intent-filter>
              <meta-data android:name="android.accessibilityservice"
                  android:resource="@xml/nostaloom_accessibility_lock" />
          </service>
          '''
          assert '</application>' in m
          m=m.replace('</application>',a11y+'</application>')
          manifest.write_text(m)
          # Clone the genuine Browser tile from the original artwork, preserving
          # its identical pixel border, size, label plate, and sparkle details.
          # Replace only the center glyph and caption for the two new siblings.
          from PIL import Image, ImageDraw, ImageFont
          picture=root/'app/src/main/res/drawable-nodpi/cozy_home.png'
          im=Image.open(picture).convert('RGBA')
          scale_x=im.width/540.0
          scale_y=im.height/1170.0
          def bb(left,top,right,bottom):
              return (round(left*scale_x),round(top*scale_y),
                      round(right*scale_x),round(bottom*scale_y))
          src_rect=bb(132,858,235,978)
          original=im.crop(src_rect)
          out_size=(round(103*scale_x),round(120*scale_y))
          original=original.resize(out_size,Image.Resampling.NEAREST)
          def create_tile(fingerprint):
              # Draw the pixel motifs in original 103x120 coordinate space and
              # then scale using NEAREST, so the dark stepped outlines remain crisp.
              tile=original.resize((103,120),Image.Resampling.NEAREST).copy()
              d=ImageDraw.Draw(tile)
              edge='#342544'
              body='#c5efd9' if fingerprint else '#f1cfeb'
              d.rounded_rectangle((15,14,89,86),radius=9,fill=body,outline=edge,width=3)
              d.rectangle((19,21,84,81),fill=body)
              if fingerprint:
                  # Pixel 8-bit fingerprint, four nested curved ridges.
                  for i in range(4):
                      off=i*7
                      d.arc((25+off,23+off,79-off,78-off),187,356,
                            fill='#8b4eab',width=4)
                  d.line((51,52,51,69),fill='#8b4eab',width=4)
                  d.rectangle((51,22,56,27),fill='#fff6cd')
              else:
                  # Calculator with dark border, purple body, screen and keypad.
                  d.rounded_rectangle((31,22,73,79),radius=4,fill='#6f448e',outline=edge,width=3)
                  d.rectangle((37,29,67,40),fill='#e3d7ef',outline=edge,width=2)
                  d.line((40,35,64,35),fill='#7b5b9d',width=2)
                  for ry in range(3):
                      for cx in range(3):
                          x=37+cx*11;y=46+ry*10
                          d.rectangle((x,y,x+7,y+7),
                            fill='#f8e5fa' if (ry,cx)!=(2,2) else '#e6a9bd',
                            outline='#3f2c57',width=1)
              # Mask the original Browser caption with the same cream plate.
              d.rounded_rectangle((12,89,94,116),radius=5,fill='#f7e9d8',outline=edge,width=2)
              title='Lockscreen' if fingerprint else 'Calculator'
              font=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSansCondensed-Bold.ttf',10)
              box=d.textbbox((0,0),title,font=font)
              tw=box[2]-box[0]
              d.text(((103-tw)/2,96),title,fill=edge,font=font)
              return tile.resize(out_size,Image.Resampling.NEAREST)
          im.alpha_composite(create_tile(False),bb(236,858,339,978)[:2])
          im.alpha_composite(create_tile(True),bb(343,858,446,978)[:2])
          im.convert('RGB').save(picture,optimize=True)
          print('Matched both new tile frames to original Browser artwork',
                im.size,src_rect)
          print('v0.24: fingerprint-friendly opt-in accessibility lock without reading screen')
          print('v0.24: visible calculator/fingerprint icons and opt-in Android screen lock')
          print('Restored complete v0.12 source with original cozy_home.png and gameplay')
          print('Removed notification listener registration for this test build')
          PY
      - name: Install Android SDK 34
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="$RUNNER_TEMP/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fLsS --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o "$RUNNER_TEMP/tools.zip"
          unzip -q "$RUNNER_TEMP/tools.zip" -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build full restored app from original sources
        working-directory: restored/NOSTALOOM-Retro-Launcher
        run: gradle --no-daemon assembleDebug
      - name: Verify package, signature and original art
        shell: bash
        run: |
          set -euo pipefail
          APK=restored/NOSTALOOM-Retro-Launcher/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/zipalign" -c -v 4 "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | head -4 | tee app-info.txt
          grep -F "com.mygamestudio.nostaloomlauncher.restoredv024" app-info.txt
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump permissions "$APK" | tee app-permissions.txt
          if grep -E 'android.permission.(BIND_NOTIFICATION_LISTENER_SERVICE|BIND_ACCESSIBILITY_SERVICE|READ_SMS|READ_CALL_LOG|QUERY_ALL_PACKAGES)' app-permissions.txt; then
            echo "::error::Restricted permission unexpectedly found"
            exit 1
          fi
          unzip -Z -1 "$APK" | grep -F 'res/drawable-nodpi' || echo "Resource packaging uses compiled asset identifiers"
          sha256sum "$APK" | tee SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: NOSTALOOM-Pixel-v0.24-Original-Graphics-Test
          path: |
            restored/NOSTALOOM-Retro-Launcher/app/build/outputs/apk/debug/app-debug.apk
            app-info.txt
            app-permissions.txt
            SHA256.txt
          if-no-files-found: error
      - name: Publish v0.24 test APK on GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir dist
          cp restored/NOSTALOOM-Retro-Launcher/app/build/outputs/apk/debug/app-debug.apk dist/NOSTALOOM-Pixel-v0.24-Original-Graphics-Test.apk
          cp SHA256.txt app-permissions.txt dist/
          cat > dist/README.txt <<'EOF'
          NOSTALOOM Pixel v0.24 Visible Icons Lock Test.
          Restored from the real archived v0.12 source, including cozy_home.png,
          original floating-island wallpaper and Mochi cat game components.
          Rebuilt as a separate package for safe side-by-side installation.
          Notification listener is disabled in this build.
          Debug-signed test APK; not Play Protect certified.
          The screen lock uses opt-in Android Accessibility GLOBAL_ACTION_LOCK_SCREEN.
          Fingerprint unlock is controlled by Android/MIUI and cannot be guaranteed.
          Do not bypass Google Play Protect warnings.
          EOF
          gh release create v0.24-original-graphics-test \
            dist/NOSTALOOM-Pixel-v0.24-Original-Graphics-Test.apk \
            dist/SHA256.txt dist/app-permissions.txt dist/README.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "NOSTALOOM Pixel v0.24 - Browser-Matched Icon Tiles (Test)" \
            --notes "Preserves original pixel art and visible Calculator/Fingerprint icons. Uses opt-in accessibility lock to improve chance of system fingerprint unlock. Separate debug app ID, notification listener disabled for safer testing. Test build only, not Play Protect certified." \
            --prerelease
